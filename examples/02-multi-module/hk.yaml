# Multi-module example: three artifact kinds, cross-module dependencies and a public interface
version: 1
project: multi-module-demo
default_target: host
default_mode: debug

# The built-in config already provides host / clang-host targets and debug / release profiles;
# this file only shows a small override:
profiles:
  release:
    cflags: [-O2, -Wall, -Wextra]
    defines: [NDEBUG]
    strip: true
