name: firmware
kind: executable
std: c11

# Besides src/, the startup file has to be compiled (the default globs exclude startup/)
sources:
  - src/**/*.c
  - startup/**/*.s

deps:
  mods: [bsp]

link:
  linker_script: link/STM32F407VGTx_FLASH.ld

targets:
  stm32f407:
    defines: [USE_HAL_DRIVER, USE_FULL_ASSERT]
