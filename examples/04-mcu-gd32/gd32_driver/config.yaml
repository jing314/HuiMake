# Vendor driver wrapper: exports the GD32 part macro and the firmware library headers
name: gd32_driver
kind: static-lib
std: c11

include: [include]
include_dirs: [../vendor/gd32]

compile:
  per_file:
    # Timing-sensitive code gets a higher optimisation level (per-file flags)
    src/gd32_timing.c: ["-O2"]

public:
  include_dirs: [../vendor/gd32]
  defines: [GD32F30X_HD, USE_STDPERIPH_DRIVER]
