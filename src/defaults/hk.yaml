# =============================================================================
# HuiMake built-in default global configuration (hk.yaml)
#
# How this file is used:
#   * hk ships this file as its defaults; any entry can be overridden by the hk.yaml
#     in your project root.
#   * `hk init` exports the effective configuration (including platform-specific
#     defaults) into the project root so you can edit it directly instead of
#     touching the tool's source.
#   * Every toolchain, target, optimisation and linker setting comes from here;
#     no tool name is hard-coded in the Rust code.
#
# Three concepts:
#   toolchains : a set of executables (cc/cxx/ar/objcopy/objdump/size)
#   targets    : a cross-compilation target (toolchain + arch flags + specs + link mode + artifacts)
#   profiles   : a build mode (optimisation level, warnings, macros, strip, artifacts)
#   final command line = toolchain x target x profile x module config.yaml
# =============================================================================
version: 1
project: null
build_dir: build

default_target: host
default_mode: debug
jobs: 0

# Temp directory for compilers (TMPDIR/TMP/TEMP); null means <module>/<build_dir>/tmp.
# A relative path is resolved against the project root, and every module gets a
# subdirectory of its own. Configure it to stop depending on whether the ambient
# TEMP is writable, and to keep build temp files in one place.
temp_dir: null

# -----------------------------------------------------------------------------
# Toolchains
# -----------------------------------------------------------------------------
toolchains:
  host:
    cc: gcc
    cxx: g++
    ar: ar
    objcopy: objcopy
    objdump: objdump
    size: size

  clang:
    cc: clang
    cxx: clang++
    ar: ar
    objcopy: objcopy
    objdump: objdump
    size: size

  arm-none-eabi:
    cc: arm-none-eabi-gcc
    cxx: arm-none-eabi-g++
    ar: arm-none-eabi-ar
    objcopy: arm-none-eabi-objcopy
    objdump: arm-none-eabi-objdump
    size: arm-none-eabi-size

  arm-none-eabi-gcc-12:
    cc: arm-none-eabi-gcc-12
    cxx: arm-none-eabi-g++-12
    ar: arm-none-eabi-gcc-ar-12
    objcopy: arm-none-eabi-objcopy
    objdump: arm-none-eabi-objdump
    size: arm-none-eabi-size

  riscv64-unknown-elf:
    cc: riscv64-unknown-elf-gcc
    cxx: riscv64-unknown-elf-g++
    ar: riscv64-unknown-elf-ar
    objcopy: riscv64-unknown-elf-objcopy
    objdump: riscv64-unknown-elf-objdump
    size: riscv64-unknown-elf-size

  xtensa-esp32-elf:
    cc: xtensa-esp32-elf-gcc
    cxx: xtensa-esp32-elf-g++
    ar: xtensa-esp32-elf-ar
    objcopy: xtensa-esp32-elf-objcopy
    objdump: xtensa-esp32-elf-objdump
    size: xtensa-esp32-elf-size

  aarch64-linux-gnu:
    cc: aarch64-linux-gnu-gcc
    cxx: aarch64-linux-gnu-g++
    ar: aarch64-linux-gnu-ar
    objcopy: aarch64-linux-gnu-objcopy
    objdump: aarch64-linux-gnu-objdump
    size: aarch64-linux-gnu-size

# -----------------------------------------------------------------------------
# Targets (cross-compilation)
#   cflags/cxxflags/ldflags/defines/libs : applied to every module of this target
#   specs        : -specs=... (nano.specs / nosys.specs / rdimon.specs ...)
#   post         : post-link artifacts, elf/bin/hex/map/size/lst
#   memory_usage : pass -Wl,--print-memory-usage and report FLASH/RAM usage (GCC 10+)
#   runnable     : can the artifact run on the host? false for MCU targets, where
#                  hk run refuses to execute it
#   static_suffix / shared_suffix / exe_suffix : artifact naming, host defaults
# -----------------------------------------------------------------------------
targets:
  host:
    toolchain: host
    cflags: []
    ldflags: []
    defines: []
    libs: []
    post: []
    runnable: true

  clang-host:
    toolchain: clang
    cflags: []
    ldflags: []
    defines: []
    libs: []
    post: []
    runnable: true

  # ---- ARM Cortex-M family (bare metal / MCU) --------------------------------
  cortex-m0:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m0, -mthumb, -mfloat-abi=soft]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m3:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m3, -mthumb, -mfloat-abi=soft]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m4:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m4, -mthumb, -mfloat-abi=soft]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m4f:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m4, -mthumb, -mfloat-abi=hard, -mfpu=fpv4-sp-d16]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m7:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m7, -mthumb, -mfloat-abi=hard, -mfpu=fpv5-sp-d16]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  # ---- RISC-V / ESP32 -----------------------------------------------------
  riscv32-unknown-elf:
    toolchain: riscv64-unknown-elf
    cflags: [-march=rv32imac, -mabi=ilp32, -mcmodel=medany, -ffunction-sections, -fdata-sections]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  xtensa-esp32-elf:
    toolchain: xtensa-esp32-elf
    cflags: [-mlongcalls]
    ldflags: ["-Wl,--gc-sections"]
    post: [elf, bin, size]
    runnable: false
    exe_suffix: .elf

# -----------------------------------------------------------------------------
# Build profiles (selected with --mode/-m)
# -----------------------------------------------------------------------------
profiles:
  debug:
    cflags: [-Og, -g3, -Wall]
    ldflags: []
    defines: [DEBUG]

  release:
    cflags: [-O2, -g0, -Wall]
    defines: [NDEBUG]
    strip: true

  # MCU debug: keep debug info, optimise enough to stay breakpoint-friendly
  mcu-debug:
    cflags: [-Og, -g3, -Wall, -ffunction-sections, -fdata-sections, -fno-common]
    defines: [DEBUG]
    post: [elf, map, size]

  # MCU release: size first + section garbage collection + no symbols, all flash artifacts
  mcu-release:
    cflags: [-Os, -g0, -Wall, -Wextra, -ffunction-sections, -fdata-sections, -fno-common]
    defines: [NDEBUG]
    strip: true
    post: [elf, bin, hex, map, size]

  # Smallest possible size
  mcu-size:
    cflags: [-Os, -g0, -Wall, -ffunction-sections, -fdata-sections, -fno-common, -flto]
    defines: [NDEBUG]
    ldflags: ["-Wl,--gc-sections", "-flto"]
    strip: true
    post: [elf, bin, hex, map, size]
