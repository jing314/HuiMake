# =============================================================================
# HuiMake 内置默认全局配置 (hk.yaml)
#
# 用法：
#   * 工具内置本文件作为默认值，任何一项都可以被项目根目录下的 hk.yaml 覆盖。
#   * 执行 `hk init` 可以把当前生效的配置（含平台相关默认值）导出到项目根，
#     之后直接编辑该文件即可，无需修改工具的源码。
#   * 所有编译器 / 链接器 / 目标 / 优化参数都来自这里，代码中不再写死任何工具名。
#
# 三个概念：
#   toolchains : 工具链 = 一组可执行文件（cc/cxx/ar/objcopy/objdump/size）
#   targets    : 目标   = 交叉编译目标（工具链 + 架构参数 + specs + 链接方式 + 产物）
#   profiles   : 配置档 = 构建模式（优化级别、警告、宏、strip、产物）
#   实际命令行 = toolchain × target × profile × 模块 config.yaml
# =============================================================================
version: 1
project: null
build_dir: build

default_target: host
default_mode: debug
jobs: 0

# 编译器临时目录（TMPDIR/TMP/TEMP），null 表示用 <模块>/<build_dir>/tmp。
# 显式配置为相对路径时相对工程根；每个模块会再分一个子目录。
# 单独配置它主要是为了：不依赖外部 TEMP 是否可写、构建临时文件集中清理。
temp_dir: null

# -----------------------------------------------------------------------------
# 工具链
# -----------------------------------------------------------------------------
toolchains:
  host:
    cc: gcc
    cxx: g++
    ar: ar
    objcopy: objcopy
    objdump: objdump
    size: size

  clang:
    cc: clang
    cxx: clang++
    ar: ar
    objcopy: objcopy
    objdump: objdump
    size: size

  arm-none-eabi:
    cc: arm-none-eabi-gcc
    cxx: arm-none-eabi-g++
    ar: arm-none-eabi-ar
    objcopy: arm-none-eabi-objcopy
    objdump: arm-none-eabi-objdump
    size: arm-none-eabi-size

  arm-none-eabi-gcc-12:
    cc: arm-none-eabi-gcc-12
    cxx: arm-none-eabi-g++-12
    ar: arm-none-eabi-gcc-ar-12
    objcopy: arm-none-eabi-objcopy
    objdump: arm-none-eabi-objdump
    size: arm-none-eabi-size

  riscv64-unknown-elf:
    cc: riscv64-unknown-elf-gcc
    cxx: riscv64-unknown-elf-g++
    ar: riscv64-unknown-elf-ar
    objcopy: riscv64-unknown-elf-objcopy
    objdump: riscv64-unknown-elf-objdump
    size: riscv64-unknown-elf-size

  xtensa-esp32-elf:
    cc: xtensa-esp32-elf-gcc
    cxx: xtensa-esp32-elf-g++
    ar: xtensa-esp32-elf-ar
    objcopy: xtensa-esp32-elf-objcopy
    objdump: xtensa-esp32-elf-objdump
    size: xtensa-esp32-elf-size

  aarch64-linux-gnu:
    cc: aarch64-linux-gnu-gcc
    cxx: aarch64-linux-gnu-g++
    ar: aarch64-linux-gnu-ar
    objcopy: aarch64-linux-gnu-objcopy
    objdump: aarch64-linux-gnu-objdump
    size: aarch64-linux-gnu-size

# -----------------------------------------------------------------------------
# 目标（交叉编译）
#   cflags/cxxflags/ldflags/defines/libs : 该目标下所有模块都会带上
#   specs        : -specs=...（nano.specs / nosys.specs / rdimon.specs ...）
#   post         : 链接后产物 elf/bin/hex/map/size/lst
#   memory_usage : 传 -Wl,--print-memory-usage 并解析 FLASH/RAM 占用（GCC 10+）
#   runnable     : 产物能否在本机运行（MCU 目标为 false，hk run 会拒绝执行）
#   static_suffix / shared_suffix / exe_suffix : 产物命名，缺省按宿主平台推断
# -----------------------------------------------------------------------------
targets:
  host:
    toolchain: host
    cflags: []
    ldflags: []
    defines: []
    libs: []
    post: []
    runnable: true

  clang-host:
    toolchain: clang
    cflags: []
    ldflags: []
    defines: []
    libs: []
    post: []
    runnable: true

  # ---- ARM Cortex-M 系列（裸机 / MCU）------------------------------------
  cortex-m0:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m0, -mthumb, -mfloat-abi=soft]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m3:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m3, -mthumb, -mfloat-abi=soft]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m4:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m4, -mthumb, -mfloat-abi=soft]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m4f:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m4, -mthumb, -mfloat-abi=hard, -mfpu=fpv4-sp-d16]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  cortex-m7:
    toolchain: arm-none-eabi
    cflags: [-mcpu=cortex-m7, -mthumb, -mfloat-abi=hard, -mfpu=fpv5-sp-d16]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  # ---- RISC-V / ESP32 -----------------------------------------------------
  riscv32-unknown-elf:
    toolchain: riscv64-unknown-elf
    cflags: [-march=rv32imac, -mabi=ilp32, -mcmodel=medany, -ffunction-sections, -fdata-sections]
    ldflags: ["-Wl,--gc-sections"]
    specs: [nano.specs, nosys.specs]
    post: [elf, bin, hex, map, size]
    memory_usage: true
    runnable: false
    exe_suffix: .elf

  xtensa-esp32-elf:
    toolchain: xtensa-esp32-elf
    cflags: [-mlongcalls]
    ldflags: ["-Wl,--gc-sections"]
    post: [elf, bin, size]
    runnable: false
    exe_suffix: .elf

# -----------------------------------------------------------------------------
# 配置档（构建模式，--mode/-m 选择）
# -----------------------------------------------------------------------------
profiles:
  debug:
    cflags: [-Og, -g3, -Wall]
    ldflags: []
    defines: [DEBUG]

  release:
    cflags: [-O2, -g0, -Wall]
    defines: [NDEBUG]
    strip: true

  # MCU 调试：保留调试信息，优化到可断点级别
  mcu-debug:
    cflags: [-Og, -g3, -Wall, -ffunction-sections, -fdata-sections, -fno-common]
    defines: [DEBUG]
    post: [elf, map, size]

  # MCU 发布：体积优先 + section 回收 + 去除符号，并输出全部烧录产物
  mcu-release:
    cflags: [-Os, -g0, -Wall, -Wextra, -ffunction-sections, -fdata-sections, -fno-common]
    defines: [NDEBUG]
    strip: true
    post: [elf, bin, hex, map, size]

  # 极限体积
  mcu-size:
    cflags: [-Os, -g0, -Wall, -ffunction-sections, -fdata-sections, -fno-common, -flto]
    defines: [NDEBUG]
    ldflags: ["-Wl,--gc-sections", "-flto"]
    strip: true
    post: [elf, bin, hex, map, size]
